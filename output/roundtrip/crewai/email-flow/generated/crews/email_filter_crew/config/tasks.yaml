filter_emails_task:
  description: 'Analyze the list of emails provided and categorize each email as either ''action_required'' or ''no_action_needed''. Use your expertise to filter out newsletters, promotional content, and spam.

    Here are the emails: {emails}'
  expected_output: A categorized list of emails with their classification as either 'action_required' or 'no_action_needed', along with a brief reason for each classification.
  agent: email_filter_agent
action_required_emails_task:
  description: For each email classified as 'action_required', analyze the content and determine the specific actions that need to be taken. Consider the urgency, context, and any deadlines mentioned in the emails.
  expected_output: A detailed action plan for each action-required email, including the specific steps to take, priority level, and any relevant deadlines.
  agent: email_action_agent
draft_responses_task:
  description: Based on the action plans provided, draft professional email responses for each action-required email. Ensure the responses are clear, concise, and appropriate for the context.
  expected_output: A set of draft email responses ready to be reviewed and sent, each properly formatted with subject line, greeting, body, and closing.
  agent: email_response_writer
