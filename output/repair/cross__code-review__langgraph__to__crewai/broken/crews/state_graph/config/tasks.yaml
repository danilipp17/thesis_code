task_code_reviewer:
  description: f"You are a senior software engineer with 15 years of experience in code review. Review the following code for correctness, readability, and best practices. Identify bugs, code smells, naming issues, and suggest improvements.\n\nCode:\n{state['code']}\n\nAnalyzer output:\n{analysis}"
  expected_output: review
  agent: code_reviewer
task_security_auditor:
  description: f"You are a certified security professional specializing in application security. Audit the following code for OWASP Top 10 issues, hardcoded secrets, injection attacks, and missing input validation. Provide CWE classifications.\n\nCode:\n{state['code']}\n\nAnalyzer output:\n{analysis}"
  expected_output: audit
  agent: security_auditor
task_review_summarizer:
  description: f"You are a technical lead. Synthesize the following review and audit findings into a structured report. Provide a verdict of APPROVED if no critical or major issues, otherwise REQUEST CHANGES. Include a summary, critical count, and action items.\n\nReview:\n{state['review']}\n\nAudit:\n{state['audit']}"
  expected_output: summary
  agent: review_summarizer
