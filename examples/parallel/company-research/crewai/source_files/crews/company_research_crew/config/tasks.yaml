search_task:
  description: >
    Search the web for recent, relevant information about {company}. Gather news,
    background, and any material that would inform a financial report.
  expected_output: >
    A set of relevant search results for {company}, each with a snippet and body content.
  agent: search_agent

analysis_task:
  description: >
    Analyze the stock for {company}. Compute key metrics (moving averages,
    volatility) and determine the overall trend, generating a price plot.
  expected_output: >
    A dictionary of stock metrics and a trend assessment for {company}, plus a saved plot path.
  agent: analysis_agent

report_task:
  description: >
    Write a comprehensive financial report on {company} using the web search
    findings and the stock analysis results.
  expected_output: >
    A comprehensive, well-structured financial report on {company}.
  agent: report_agent
